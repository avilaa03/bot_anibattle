name: Testes

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

jobs:
  testes:
    name: Suíte de testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A mesma versão do Dockerfile e do campo `engines` do package.json.
      # Divergir aqui faria o CI passar com um Node que a produção não usa.
      - name: Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18.12.1'
          cache: npm

      # O `canvas` é compilado na instalação e precisa destas bibliotecas.
      # Sem elas, o `npm ci` falha antes de chegar em qualquer teste — e o
      # erro que aparece ("node-gyp exited with code 1") não diz o que falta.
      #
      # A lista é a mesma do Dockerfile de propósito: se um dia faltar uma
      # aqui, falta lá também.
      - name: Dependências do canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            build-essential \
            g++

      - run: npm ci

      # Os testes não tocam no banco: rodam tudo em memória com dublês.
      # É por isso que não há MONGODB_URI aqui — e é proposital, porque um
      # teste que precisa de banco não roda em runner de CI.
      - name: Rodar os testes
        run: npm test
