name: Testes e deploy

# Um arquivo só, com dois trabalhos, porque o segundo depende do primeiro:
# o deploy só existe se os testes passarem. Em arquivos separados isso
# exigiria `workflow_run`, que é mais difícil de ler e de depurar.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Permite disparar o deploy pela aba Actions, sem precisar de um commit.
  workflow_dispatch:

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # O canvas é dependência nativa: sem estas bibliotecas o `npm ci`
      # tenta compilar do zero e falha. São as mesmas do Dockerfile.
      - name: Dependências do canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev build-essential

      - name: Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18.12.1'
          cache: npm

      - run: npm ci

      # Os testes rodam sem banco e sem Discord, de propósito — por isso
      # cabem aqui sem nenhum serviço extra.
      - run: npm test

  implantar:
    name: Publicar na VPS
    needs: testes
    # Só a main vai para produção. Push na develop roda os testes e para
    # por aí, que é justamente o ponto de ter a develop.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Ambiente do GitHub: dá para exigir aprovação manual depois, se você
    # quiser, sem mexer neste arquivo.
    environment: producao

    # Um deploy por vez, e nunca cancelar um pela metade.
    #
    # Dois pushes seguidos disparavam dois deploys simultâneos no MESMO
    # diretório da VPS, os dois fazendo `git reset --hard` e
    # `docker compose up --build` ao mesmo tempo. O resultado é imprevisível:
    # o build de um pega arquivos que o outro acabou de trocar.
    #
    # `cancel-in-progress: false` enfileira em vez de cancelar — matar um
    # deploy no meio do build deixa o contêiner num estado pior do que
    # simplesmente esperar.
    concurrency:
      group: deploy-vps-bot
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Sem isto, secret faltando vira um erro de SSH incompreensível lá na
      # frente ("Permission denied" ou "Could not resolve hostname ''").
      # Falhar aqui, dizendo exatamente qual falta, economiza a investigação.
      - name: Conferir os secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          faltando=""
          if [ -z "$VPS_HOST" ];    then faltando="$faltando VPS_HOST"; fi
          if [ -z "$VPS_USER" ];    then faltando="$faltando VPS_USER"; fi
          if [ -z "$VPS_SSH_KEY" ]; then faltando="$faltando VPS_SSH_KEY"; fi
          if [ -z "$DEPLOY_DIR" ];  then faltando="$faltando DEPLOY_DIR"; fi

          if [ -n "$faltando" ]; then
            echo "❌ Faltam secrets:$faltando"
            echo "   Cadastre em: Settings > Secrets and variables > Actions."
            echo "   O passo a passo está no DEPLOY.md."
            exit 1
          fi
          echo "✅ Secrets presentes."

      - name: Preparar chave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          # Pela variável de ambiente, não interpolado direto no script: uma
          # chave com aspas ou barra invertida quebraria o shell se fosse
          # colada dentro do comando.
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Fixa a identidade do servidor para o SSH não perguntar nada.
          #
          # Com o secret VPS_KNOWN_HOSTS cadastrado, confiamos só naquela
          # chave. Sem ele, o keyscan confia no que o servidor responder na
          # hora — o que teoricamente abre espaço para um ataque no meio do
          # caminho. Para fechar isso: rode `ssh-keyscan -H SEU_IP` na sua
          # máquina e salve a saída no secret VPS_KNOWN_HOSTS.
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "▶ Identidade da VPS vinda do secret VPS_KNOWN_HOSTS."
          else
            ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            echo "⚠️  VPS_KNOWN_HOSTS não cadastrado: confiando no keyscan."
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Rodar o deploy na VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          # O script vive no repositório (versionado, revisável) e é
          # enviado pela entrada padrão do bash remoto. Assim a lógica de
          # deploy não fica escondida dentro do YAML.
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' bash -s" < deploy/implantar.sh

      - name: Resumo
        if: always()
        run: |
          echo "Commit publicado: ${{ github.sha }}"
